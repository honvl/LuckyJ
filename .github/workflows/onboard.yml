name: Onboard tutor players

# Fetches each new subscriber's ranked Mahjong Soul games and starts their tutor thread
# (service/thread.py onboard). The site's Stripe webhook starts this right after a purchase;
# the hourly run picks up anyone still waiting (fewer than 10 games, or a fetch that failed).
# It then tops up players who already have a thread (service/thread.py games): a fetch account
# may retrieve only about 20 logs before Mahjong Soul refuses it, so a player's newest 100 games
# arrive over several runs, and games played later are added the same way.
#
# This repository is public, and so are these logs: thread.py prints no emails, names,
# account ids or game ids when GITHUB_ACTIONS is set.

on:
  workflow_dispatch:
    inputs:
      check_login:
        description: "Only check the fetch accounts: each downloads one game already public on the site"
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: onboard
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.ready.outputs.ok }}
    steps:
      - name: Check the secrets are set
        id: ready
        env:
          # The login check needs only the fetch account; onboarding needs everything.
          NEED: ${{ secrets.MJS_ACCESS_TOKEN != '' && secrets.MJS_RANDOM_KEY != '' && (inputs.check_login || (secrets.DATABASE_URL != '' && secrets.ANTHROPIC_API_KEY != '' && secrets.AMAE_KOROMO_TOKEN != '')) }}
        run: |
          echo "ok=$NEED" >> "$GITHUB_OUTPUT"
          [ "$NEED" = true ] || echo "::notice::Onboarding is not configured yet (repository secrets missing); nothing to do."

  onboard:
    needs: check
    if: needs.check.outputs.ok == 'true'
    runs-on: ubuntu-latest
    # Each player's download stops itself at 15 minutes (scripts/fetch_player_games.py) and keeps
    # what it has; this limit is the backstop for several players in one run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/requirements.txt

      - run: pip install -r service/requirements.txt

      - name: Check out tensoul (the Mahjong Soul record fetcher)
        uses: actions/checkout@v4
        with:
          repository: honvl/tensoul
          ref: 17845ee56f89a7e34ecac25a00568e28b6f4a20f # luckyj-fetch (v4-web-client-login plus the 9998 fix)
          path: tmp/tensoul

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tensoul
        working-directory: tmp/tensoul
        run: |
          npm install --no-audit --no-fund --loglevel=error
          cp ../../service/fetch/tensoul-config.js config.js

      - name: Onboard waiting players
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AMAE_KOROMO_TOKEN: ${{ secrets.AMAE_KOROMO_TOKEN }}
          # The fetch accounts (never the operator's playing account), each with its own device
          # key. Mahjong Soul limits how many logs one account may retrieve (error 540), so a run
          # uses the first until it is over its limit, then the next (scripts/fetch_player_games.py).
          # An empty slot is skipped; to add an account, set both of its secrets.
          ACCESS_TOKEN: ${{ secrets.MJS_ACCESS_TOKEN }}
          MJS_RANDOM_KEY: ${{ secrets.MJS_RANDOM_KEY }}
          MJS_ACCESS_TOKEN_2: ${{ secrets.MJS_ACCESS_TOKEN_2 }}
          MJS_RANDOM_KEY_2: ${{ secrets.MJS_RANDOM_KEY_2 }}
          MJS_ACCESS_TOKEN_3: ${{ secrets.MJS_ACCESS_TOKEN_3 }}
          MJS_RANDOM_KEY_3: ${{ secrets.MJS_RANDOM_KEY_3 }}
          MJS_ACCESS_TOKEN_4: ${{ secrets.MJS_ACCESS_TOKEN_4 }}
          MJS_RANDOM_KEY_4: ${{ secrets.MJS_RANDOM_KEY_4 }}
          MJS_ACCESS_TOKEN_5: ${{ secrets.MJS_ACCESS_TOKEN_5 }}
          MJS_RANDOM_KEY_5: ${{ secrets.MJS_RANDOM_KEY_5 }}
          MJS_ACCESS_TOKEN_6: ${{ secrets.MJS_ACCESS_TOKEN_6 }}
          MJS_RANDOM_KEY_6: ${{ secrets.MJS_RANDOM_KEY_6 }}
          MJS_ACCESS_TOKEN_7: ${{ secrets.MJS_ACCESS_TOKEN_7 }}
          MJS_RANDOM_KEY_7: ${{ secrets.MJS_RANDOM_KEY_7 }}
          MJS_ACCESS_TOKEN_8: ${{ secrets.MJS_ACCESS_TOKEN_8 }}
          MJS_RANDOM_KEY_8: ${{ secrets.MJS_RANDOM_KEY_8 }}
          MJS_BASE: ${{ vars.MJS_BASE }}
          MJS_GATEWAY: ${{ vars.MJS_GATEWAY }}
          MJS_ROUTE_ID: ${{ vars.MJS_ROUTE_ID }}
          MJS_TAG: ${{ vars.MJS_TAG }}
          # Bump when logins fail with error 151 (the game updated).
          MJS_RES_VERSION: ${{ vars.MJS_RES_VERSION }}
          MJS_PACKAGE_VERSION: ${{ vars.MJS_PACKAGE_VERSION }}
        run: |
          if [ "${{ inputs.check_login }}" = true ]; then
            game=$(python -c "import json; print(json.load(open('site/replays/index.json'))['games'][0]['id'])")
            # One line per account: ok, over its log retrieval limit, or why it could not log in.
            python -u scripts/fetch_player_games.py --check-accounts "$game"
          else
            # New subscribers first; then players who already have a thread are topped up toward
            # their newest 100 games with whatever the fetch accounts still allow.
            rc=0
            python -u service/thread.py onboard || rc=$?
            python -u service/thread.py games || rc=$?
            exit $rc
          fi

      # Players' Mahjong Soul ranks for the Personal Guides library (prints counts only).
      - name: Refresh player ranks
        if: ${{ inputs.check_login != true }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AMAE_KOROMO_TOKEN: ${{ secrets.AMAE_KOROMO_TOKEN }}
        run: python service/thread.py ranks
